set -s escape-time 0

set -g status-left-length 50
set -g status-right-length 100
set -g base-index 1
set -g mouse on

set-option -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm*:RGB:usstyle"
set -ga terminal-overrides ",tmux-256color:Tc"
set -g set-clipboard on
set -g allow-passthrough on
set-window-option -g mode-keys vi

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix
bind r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf"
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R
bind -r ^ last-window

bind-key -r f run-shell "tmux neww ~/.dotfiles/bin/tmux-sessionizer"
bind-key -r M-h run-shell "tmux neww tmux-sessionizer -s 0"
bind-key -r M-t run-shell "tmux neww tmux-sessionizer -s 1"
bind-key -r M-n run-shell "tmux neww tmux-sessionizer -s 2"
bind-key -r M-s run-shell "tmux neww tmux-sessionizer -s 3"


# Fish is the login shell on both OSes (setup.sh chsh's to it). tmux defaults
# default-shell to the $SHELL captured when the *server* started, so a long-lived
# server can spawn an outdated shell (e.g. the pre-fish zsh on macOS, whose
# dotfiles were deleted in the migration -> no starship prompt in panes).
# default-shell needs a literal absolute path, so resolve fish per install prefix.
if-shell "command -v fish >/dev/null 2>&1" {
    if-shell "test -x /opt/homebrew/bin/fish" "set -g default-shell /opt/homebrew/bin/fish"
    if-shell "test -x /usr/local/bin/fish" "set -g default-shell /usr/local/bin/fish"
    if-shell "test -x /usr/bin/fish" "set -g default-shell /usr/bin/fish"
}
source-file -q "$XDG_CONFIG_HOME/tmux/themes/noctalia.conf"
