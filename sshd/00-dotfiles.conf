# Managed by dotfiles: sshd/00-dotfiles.conf
# Installed to /etc/ssh/sshd_config.d/00-dotfiles.conf by setup.sh.
# Key-only logins for the local user; no passwords, no root.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
AuthenticationMethods publickey
AllowUsers ajg
MaxAuthTries 3
LoginGraceTime 30
