
after-login-command = []

after-startup-command = [
  'exec-and-forget sketchybar >> $HOME/.sketchybar/service.log 2>&1',

  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0',
]

exec-on-workspace-change = [
  '/bin/bash',
  '-c',
  'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE FOCUSED_DISPLAY=$(aerospace list-monitors --focused | awk "{print $1}")',
]

on-focus-changed = [
  'exec-and-forget sketchybar --trigger aerospace_focus_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE',
]

start-at-login = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30

default-root-container-layout = 'tiles'

default-root-container-orientation = 'auto'

key-mapping.preset = 'qwerty'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = [
  { monitor."LG HDR 4K" = 40 },
  { monitor."Sidecar Display" = 40 },
  10,
]
outer.right = 10

[mode.main.binding]

alt-enter = 'exec-and-forget open -a Ghostty'

alt-t = 'exec-and-forget wezterm start'

cmd-h = []
cmd-alt-h = []

alt-f = 'fullscreen'

alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

alt-left = 'focus left'
alt-down = 'focus down'
alt-up = 'focus up'
alt-right = 'focus right'

alt-shift-left = 'move left'
alt-shift-down = 'move down'
alt-shift-up = 'move up'
alt-shift-right = 'move right'

alt-shift-minus = 'resize smart -50'
alt-shift-equal = 'resize smart +50'
alt-shift-c = 'reload-config'

f1 = 'workspace 1'
f2 = 'workspace 2'
f3 = 'workspace 3'
f4 = 'workspace 4'
f5 = 'workspace 5'
f6 = 'workspace 6'
f7 = 'workspace 7'
f8 = 'workspace 8'
f9 = 'workspace 9'

shift-f1 = 'move-node-to-workspace 1'
shift-f2 = 'move-node-to-workspace 2'
shift-f3 = 'move-node-to-workspace 3'
shift-f4 = 'move-node-to-workspace 4'
shift-f5 = 'move-node-to-workspace 5'
shift-f6 = 'move-node-to-workspace 6'
shift-f7 = 'move-node-to-workspace 7'
shift-f8 = 'move-node-to-workspace 8'
shift-f9 = 'move-node-to-workspace 9'

alt-tab = 'workspace-back-and-forth'

alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

alt-shift-semicolon = [
  'mode service',
  'exec-and-forget sketchybar --trigger aerospace_enter_service_mode',
]

[mode.service.binding]
esc = [
  'reload-config',
  'mode main',
  'exec-and-forget sketchybar --trigger aerospace_leave_service_mode',
]
r = ['flatten-workspace-tree', 'mode main']

f = [
  'layout floating tiling',
  'mode main',
  'exec-and-forget sketchybar --trigger aerospace_leave_service_mode',
]
backspace = [
  'close-all-windows-but-current',
  'mode main',
  'exec-and-forget sketchybar --trigger aerospace_leave_service_mode',
]

alt-shift-left = [
  'join-with left',
  'mode main',
  'exec-and-forget sketchybar --trigger aerospace_leave_service_mode',
]
alt-shift-down = [
  'join-with down',
  'mode main',
  'exec-and-forget sketchybar --trigger aerospace_leave_service_mode',
]
alt-shift-up = [
  'join-with up',
  'mode main',
  'exec-and-forget sketchybar --trigger aerospace_leave_service_mode',
]
alt-shift-right = [
  'join-with right',
  'mode main',
  'exec-and-forget sketchybar --trigger aerospace_leave_service_mode',
]

[[on-window-detected]]
if.app-id = 'app.zen-browser.zen'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 2'

