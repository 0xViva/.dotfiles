# User CLI tools; system packages stay in packages.yaml.
[settings]
# Keep SDKs out of an inherited DOTNET_ROOT, which can be root-owned (archmac).
dotnet.isolated = true

[tools]
air = "latest"
bat = "latest"
btop = { version = "latest", os = "linux" }
bun = "latest"
clang = "latest"
dotnet = "latest"
fd = "latest"
fzf = "latest"
gh = "latest"
go = "latest"
java = "latest"
jq = "latest"
lua = "5.5"
neovim = "0.12.6"
node = "latest"
"npm:markdownlint-cli" = "latest"
odin = "dev-2026-11a"
opencode = "latest"
python = "3.15.2"
ripgrep = "latest"
rust = "latest"
starship = "latest"
task = "latest"
tree-sitter = "latest"
