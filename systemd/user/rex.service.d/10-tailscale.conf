[Service]
# Serve the personal server over this machine's own Tailscale node
# (desktop.tail76e5ad.ts.net) instead of enrolling a separate rex-desktop
# tsnet node. Clients reach it at http://desktop.tail76e5ad.ts.net:7297.
ExecStart=
ExecStart=/usr/bin/rex server run --log-format text --extra-listen tailnet://:7297
