# Noctalia v5 — shell configuration.
#
# This file lists Noctalia's built-in DEFAULTS so you can tune them. It is your
# declarative layer; edit values here to pin them across machines.
#
# IMPORTANT — how GUI settings interact:
#   1. built-in defaults
#   2. this file  (~/.config/noctalia/*.toml)
#   3. ~/.local/state/noctalia/settings.toml  <- written by the Settings GUI, WINS
# Noctalia never rewrites this file. If you change a key in the GUI it is saved
# to settings.toml and shadows your value here. So tune a key in one place only;
# if an edit here seems ignored, delete that key from settings.toml.
#
# Caveat: listing a default pins it. If a future Noctalia release changes a
# default, remove the key here to pick up the new one.
#
# Validate with: noctalia config validate

