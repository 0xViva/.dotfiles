[widget.media]
artist_first = true
art_size = 20.0
hide_when_no_media = true
# Hard cap so the media widget cannot grow into the centered clock. This is a
# fixed cap, not collision detection: it truncates the title whenever it
# exceeds this width, even when there is free space. Upstream's default is
# 220.0; the previous 400.0 is what could reach the clock on a busy end row.
max_length = 220.0
min_length = 80.0
title_scroll = "on_hover"
type = "media"

[widget.network_rx]
stat = "net_rx"
type = "sysmon"

[widget.network_tx]
stat = "net_tx"
type = "sysmon"

[widget.output_volume]
device = "output"
type = "volume"

[widget.ram]
stat = "ram_used"
type = "sysmon"

[widget.spacer]
interactive = false
type = "spacer"

[widget.temp]
stat = "cpu_temp"
type = "sysmon"
