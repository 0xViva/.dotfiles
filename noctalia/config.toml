# Palette for the whole desktop. Noctalia renders this into every enabled app
# template below, so changing it re-themes everything (shell, GTK/Qt, terminal,
# editors, …). `source` selects which field is authoritative:
#   "builtin <name>" | "wallpaper" | "community <name>" | "custom <file>"
[theme]
builtin = "Rosé Pine"
community_palette = "Oxocarbon"
custom_palette = ""
mode = "dark"
pure_black_dark = false
shell_mode = "follow"
source  = "builtin"
wallpaper_scheme = "m3-content"

    # App theming. Noctalia's own engine renders these templates from the palette
    # above and writes the result into each app's config. Some generated files
    # keep a "matugen" name (nvim's lua/matugen.lua, opencode's matugen.json)
    # because the templates originated in the matugen ecosystem. The matugen CLI
    # is NOT installed or used — Noctalia does the rendering.
    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "qt", "ghostty", "hyprland", "btop" ]
    community_ids = [ "neovim", "tmux", "fzf", "opencode" ]
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper]
directory = ""
directory_dark = ""
directory_light = ""
edge_smoothness = 0.3
enabled = true
fill_color = ""
fill_mode = "crop"
per_monitor_directories = false
transition = [ "fade", "wipe", "disc", "stripes", "zoom", "honeycomb" ]
transition_duration = 1500.0
transition_on_startup = false

    # Default wallpaper (declarative). Picking one in the GUI/IPC writes the
    # same key to settings.toml, which then overrides this value.
    [wallpaper.default]
    path = "/home/ajg/.config/assets/backgrounds/nord.png"

    [wallpaper.automation]
    enabled = false
    interval_seconds = 1800
    order = "random"
    recursive = true

